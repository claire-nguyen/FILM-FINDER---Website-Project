<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Details - Film Finder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="filmfinder.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container header-row">
            <a class="logo" href="index.html">Film Finder</a>
            <nav class="header-nav">
                <a href="index.html">Back to search</a>
                <button id="theme-button" class="btn btn-outline" type="button">Light mode</button>
            </nav>
        </div>
    </header>
    <div class="filmstrip" aria-hidden="true"></div>

    <main class="container">
        <p id="message" role="status">Loading film...</p>

        <article id="detail" class="hidden">
            <h1 id="film-title"></h1>

            <div class="detail-row">
                <div id="image-box" class="image-box"></div>

                <section class="panel info-panel">
                    <h2>Film Info</h2>
                    <dl id="info-list"></dl>
                </section>
            </div>

            <section class="panel">
                <h2>Where to Buy</h2>
                <p id="price-note"></p>
                <div id="shop-links" class="link-row"></div>
            </section>

            <section class="panel">
                <h2>Sample Photos</h2>
                <p id="gallery-note">Searching for sample photos...</p>
                <div id="gallery" class="gallery"></div>
                <div id="photo-links" class="link-row"></div>
            </section>

            <section class="panel">
                <h2>Where to Develop</h2>
                <p id="lab-note"></p>
                <div id="lab-links" class="link-row"></div>
            </section>
        </article>
    </main>

    <footer class="container site-footer">
        <p>
            Film data: <a href="https://www.filmrescue.com/film-database/" target="_blank" rel="noopener">Film Rescue Photographic Film Index</a>.
        </p>
    </footer>
</body>
</html>
